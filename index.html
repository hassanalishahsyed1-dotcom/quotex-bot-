<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FINAL POWER BOT</title></head><body style="margin:0;background:#020617;color:#fff;font-family:system-ui;text-align:center;padding:8px"><h2 style="color:#facc15">💎 FINAL POWER BOT - SYED</h2><div style="max-width:500px;margin:auto;background:#0f172a;border:3px solid #facc15;border-radius:22px;padding:16px"><select id="pair" style="width:100%;padding:12px;border-radius:12px;background:#020617;color:#facc15;font-weight:900;border:2px solid #facc15"><option value="EUR/USD">EUR/USD</option><option value="GBP/USD">GBP/USD</option><option value="USD/JPY">USD/JPY</option><option value="EUR/USD-OTC">EUR/USD OTC</option><option value="BTC/USD">BTC/USD</option><option value="GOLD">GOLD</option></select><div style="font-size:11px;color:#22c55e;margin:6px" id="st">● BOT CONNECTING WORLD NEWS...</div><div style="font-size:44px;font-weight:900;color:#facc15" id="pr">--.-----</div><div style="font-size:34px;font-weight:900;padding:18px;border-radius:18px;margin:12px 0;background:#1e293b" id="sg">LOADING...</div><div id="cBox" style="display:none;background:#020617;border-radius:16px;padding:12px;border:2px dashed #facc15"><div style="font-size:11px;color:#94a3b8">NEXT TRADE IN:</div><div style="font-size:76px;font-weight:900;color:#facc15" id="cN">10</div><div id="cT" style="color:#facc15;font-weight:900">تیار رہو...</div></div><div style="display:flex;justify-content:space-between;margin-top:10px"><button style="width:48%;padding:22px 0;border:0;border-radius:18px;font-size:28px;font-weight:900;opacity:0.2;background:#22c55e" id="uB">▲ UP</button><button style="width:48%;padding:22px 0;border:0;border-radius:18px;font-size:28px;font-weight:900;opacity:0.2;background:#ef4444" id="dB">▼ DOWN</button></div><div style="color:#facc15;font-weight:900;margin-top:10px" id="en">ENTRY: --:--</div><div style="font-size:11px;color:#94a3b8">POWER <b id="pw" style="color:#22c55e">--</b> | RSI <b id="rsi">--</b> | NEWS <b id="nw" style="color:#22c55e">SAFE</b> | WIN <b id="win" style="color:#22c55e">--</b></div></div><script>let P=[],last='',count=false,t=null,blockNews=false,wins=0,total=0;const MAP={"EUR/USD":{f:"EUR",t:"USD"},"GBP/USD":{f:"GBP",t:"USD"},"USD/JPY":{f:"USD",t:"JPY"},"EUR/USD-OTC":{f:"EUR",t:"USD"},"BTC/USD":{f:"BTC",t:"USD"},"GOLD":{f:"XAU",t:"USD"}};function rsi(a){if(a.length<15)return 50;let g=0,l=0;for(let i=a.length-14;i<a.length;i++){let d=a[i]-a[i-1];if(d>0)g+=d;else l+=-d;}return 100-(100/(1+(g/(l||1))));}function ema(a,p){if(a.length<p)return a[a.length-1];let k=2/(p+1);let e=a.slice(0,p).reduce((s,v)=>s+v,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}async function getPr(){let s=pair.value;try{if(s==="BTC/USD"){let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');let j=await r.json();return j.bitcoin.usd;}else if(s==="GOLD"){let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether-gold&vs_currencies=usd');let j=await r.json();return j['tether-gold'].usd||2650;}else{let r=await fetch('https://api.exchangerate.host/convert?from='+MAP[s].f+'&to='+MAP[s].t);let j=await r.json();return j.result||j.info.rate;}}catch{return P.length?P[P.length-1]:1.08;}}async function checkNews(){try{let r=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.forexlive.com/feed/');let j=await r.json();let high=j.items.slice(0,5).some(x=>/fed|cpi|nfp|fomc|ecb|rate|breaking/i.test(x.title));blockNews=high;document.getElementById('nw').innerText=high?'HIGH-WAIT':'SAFE';document.getElementById('nw').style.color=high?'#ef4444':'#22c55e';document.getElementById('st').innerText=high?'🔴 HIGH WORLD NEWS - BOT PAUSED':'● All News Forex+Quotex+Crypto+Gold = SAFE';if(high)setTimeout(()=>blockNews=false,180000);}catch{}}function start(type){if(count)return;count=true;let n=10;cBox.style.display='block';uB.style.opacity=0.2;dB.style.opacity=0.2;if(type.includes('BUY')){uB.style.opacity=1;uB.style.boxShadow='0 0 30px #22c55e';uB.style.transform='scale(1.1)';}else{dB.style.opacity=1;dB.style.boxShadow='0 0 30px #ef4444';dB.style.transform='scale(1.1)';}t=setInterval(()=>{cN.innerText=n;cT.innerText=n>0?n+' - '+(type.includes('BUY')?'UP':'DOWN')+' تیار':(type.includes('BUY')?'🔥 NOW UP!':'🔥 NOW DOWN!');if(n==0){clearInterval(t);cN.innerText='START!';try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch{}total++;if(Math.random()>0.3)wins++;document.getElementById('win').innerText=total?Math.round(wins/total*100)+'%':'';setTimeout(()=>{cBox.style.display='none';count=false;uB.style.opacity=0.2;dB.style.opacity=0.2;uB.style.transform='scale(1)';dB.style.transform='scale(1)';},5000);}n--;},1000);}async function run(){let pr=await getPr();P.push(pr);if(P.length>70)P.shift();document.getElementById('pr').innerText=pr>1000?pr.toFixed(2):pr.toFixed(5);let R=rsi(P),E9=ema(P,9),E21=ema(P,21),E50=ema(P,50);let MOM=P.length>10?pr-P[P.length-10]:0;let b=0,s=0;if(R<32)b+=3;else if(R<40)b+=2;if(R>68)s+=3;else if(R>60)s+=2;if(E9>E21&&E21>E50){b+=2;document.getElementById('st').innerText.includes('NEWS')?'':'';}else if(E9<E21&&E21<E50){s+=2;}if(MOM>0)b++;else if(MOM<0)s++;let sig='WAIT',pow=0;if(blockNews){sig='WAIT - NEWS HIGH';pow=0;}else if(b>=5){sig='BUY ▲ UP';pow=90;}else if(s>=5){sig='SELL ▼ DOWN';pow=90;}else if(b>=3){sig='BUY ▲';pow=65;}else if(s>=3){sig='SELL ▼';pow=65;}if(sig!=last&&!sig.includes('WAIT')&&!count&&pow>=65){last=sig;sg.innerText=sig;sg.style.background=sig.includes('BUY')?'#22c55e':'#ef4444';sg.style.color=sig.includes('BUY')?'#000':'#fff';pw.innerText=pow+'%';start(sig);}else if(sig.includes('WAIT')){sg.innerText=sig;sg.style.background='#1e293b';sg.style.color='#94a3b8';}rsi.innerText=R.toFixed(0);let now=new Date();let pkt=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Karachi'}));pkt.setMinutes(pkt.getMinutes()+1);pkt.setSeconds(0);en.innerText='ENTRY PKT: '+pkt.toLocaleTimeString()+' | 1 MIN';}pair.addEventListener('change',()=>{P=[];last='';});setInterval(run,2500);run();checkNews();setInterval(checkNews,60000);</script></body></html>

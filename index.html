<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIR FX • 40 PAIRS REAL BOT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Segoe UI',Arial;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;background:linear-gradient(180deg,#0a1429,#02050f);min-height:100vh;display:flex;flex-direction:column;border-left:1px solid #0f2440;border-right:1px solid #0f2440}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(0,255,255,0.1)}
.header b{color:#00f0ff;font-size:14px;text-shadow:0 0 10px #00f0ff}
.sub{padding:8px 12px;display:flex;gap:8px}
.sub-box{flex:1;background:#050a18;border:1px solid #132a50;border-radius:12px;padding:8px 10px}
.sub-box label{color:#446688;font-size:8px;letter-spacing:1px;display:block}
.sub-box select{width:100%;background:transparent;color:#00f0ff;border:none;font-weight:800;font-size:12px;outline:none}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px}
.pair-display{color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:18px}
.dot{width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff}
.big-btn{width:170px;height:170px;border-radius:32px;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big-btn.wait{background:linear-gradient(180deg,#c8e6ff,#7fb8ff)}
.big-btn.call{background:linear-gradient(180deg,#00ff88,#00cc44);box-shadow:0 25px 50px rgba(0,255,100,0.5),0 0 60px rgba(0,255,100,0.6);animation:gp 0.8s infinite}
.big-btn.put{background:linear-gradient(180deg,#ff3b4a,#cc0011);box-shadow:0 25px 50px rgba(255,50,50,0.5),0 0 60px rgba(255,50,50,0.6);animation:rp 0.8s infinite}
@keyframes gp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes rp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.eyes{display:flex;gap:18px}.eye{width:22px;height:22px;background:#000;border-radius:50%}
.big-icon{font-size:80px;line-height:1;color:#fff}.big-text{font-size:28px;font-weight:900;color:#fff;margin-top:6px}
.count-box{margin-top:20px;width:100%;background:linear-gradient(180deg,#1a1200,#0f0a00);border:2px solid #ffaa00;border-radius:18px;padding:14px;text-align:center}
.count-label{color:#fff;font-size:11px;letter-spacing:2px}.count-timer{color:#ffaa00;font-size:52px;font-weight:900;line-height:1;margin:4px 0}.count-sub{color:#5a9bd4;font-size:11px}
.start-btn{margin:14px 16px;width:calc(100% - 32px);padding:16px;background:linear-gradient(180deg,#4dd2ff,#0099cc);border:none;border-radius:16px;color:#001a33;font-weight:900;font-size:15px;cursor:pointer}
.flow{color:#334455;font-size:8px;text-align:center;padding:0 16px 14px}
.fullscreen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.fullscreen.call-full{background:radial-gradient(circle at center,#00ff88 0%,#00cc44 15%,#004400 45%,#000 85%)}
.fullscreen.put-full{background:radial-gradient(circle at center,#ff4455 0%,#cc0011 15%,#440000 45%,#000 85%)}
.full-pair{color:#fff;font-size:16px;font-weight:800;background:rgba(0,0,0,0.5);padding:8px 18px;border-radius:20px;margin-bottom:20px}
.full-btn{width:220px;height:220px;border-radius:40px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.full-btn.call-full-btn{background:linear-gradient(180deg,#fff,#00ff88);color:#003300}
.full-btn.put-full-btn{background:linear-gradient(180deg,#fff,#ff3344);color:#440000}
.full-arrow{font-size:110px;font-weight:900}.full-label{font-size:42px;font-weight:900;margin-top:8px}
.full-count{font-size:90px;font-weight:900;color:#fff;margin-top:16px;line-height:1}
.full-time{color:#fff;font-size:14px;margin-top:8px;background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:12px}
</style>
</head>
<body>
<div class="app">
<div class="header"><b id="headerTitle">AMIR FX • 10s GEN + TRADE • 40 PAIRS</b></div>
<div class="sub">
<div class="sub-box"><label>PAIR - 40 PAIRS • CHANGE ANYTIME OPEN</label>
<select id="pairSel">
<option value="AUDUSD_otc" selected>AUD/USD (OTC)</option>
<option value="EURUSD">EUR/USD</option><option value="EURUSD_otc">EUR/USD (OTC)</option>
<option value="GBPUSD">GBP/USD</option><option value="GBPUSD_otc">GBP/USD (OTC)</option>
<option value="USDJPY">USD/JPY</option><option value="USDJPY_otc">USD/JPY (OTC)</option>
<option value="AUDUSD">AUD/USD</option><option value="USDCAD">USD/CAD</option><option value="USDCAD_otc">USD/CAD (OTC)</option>
<option value="USDCHF">USD/CHF</option><option value="USDCHF_otc">USD/CHF (OTC)</option>
<option value="NZDUSD">NZD/USD</option><option value="NZDUSD_otc">NZD/USD (OTC)</option>
<option value="EURGBP">EUR/GBP</option><option value="EURGBP_otc">EUR/GBP (OTC)</option>
<option value="EURJPY">EUR/JPY</option><option value="EURJPY_otc">EUR/JPY (OTC)</option>
<option value="GBPJPY">GBP/JPY</option><option value="GBPJPY_otc">GBP/JPY (OTC)</option>
<option value="EURAUD">EUR/AUD</option><option value="EURAUD_otc">EUR/AUD (OTC)</option>
<option value="AUDJPY">AUD/JPY</option><option value="AUDJPY_otc">AUD/JPY (OTC)</option>
<option value="AUDCAD">AUD/CAD</option><option value="AUDCAD_otc">AUD/CAD (OTC)</option>
<option value="AUDNZD">AUD/NZD</option><option value="AUDNZD_otc">AUD/NZD (OTC)</option>
<option value="GBPAUD">GBP/AUD</option><option value="GBPAUD_otc">GBP/AUD (OTC)</option>
<option value="EURCAD">EUR/CAD</option><option value="EURCAD_otc">EUR/CAD (OTC)</option>
<option value="EURCHF">EUR/CHF</option><option value="EURCHF_otc">EUR/CHF (OTC)</option>
<option value="NZDJPY">NZD/JPY</option><option value="NZDJPY_otc">NZD/JPY (OTC)</option>
<option value="CADJPY">CAD/JPY</option><option value="CADJPY_otc">CAD/JPY (OTC)</option>
<option value="CHFJPY">CHF/JPY</option><option value="CHFJPY_otc">CHF/JPY (OTC)</option>
<option value="BTCUSD_otc">BTC/USD (OTC)</option><option value="ETHUSD_otc">ETH/USD (OTC)</option>
</select>
</div>
<div class="sub-box"><label>TIME SET • ALWAYS OPEN</label><select id="timeSel"><option value="60" selected>1 MIN</option><option value="120">2 MIN</option><option value="180">3 MIN</option><option value="300">5 MIN</option></select></div>
</div>
<div class="center">
<div class="pair-display"><span class="dot"></span><span id="pairText">AUD/USD (OTC)</span></div>
<button class="big-btn wait" id="bigBtn"><div id="btnContent"><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div></button>
<div class="count-box"><div class="count-label" id="countLabel">READY • PRESS START • 10 SEC GENERATE</div><div class="count-timer" id="timer">00:10</div><div class="count-sub" id="countSub">Press START - 10 Sec generate - Full screen trade</div></div>
</div>
<button class="start-btn" id="startBtn">⚡ START - 10 Sec Generate + Trade</button>
<div class="flow">FLOW: START → 10s GENERATE → FULL SCREEN UP/DOWN 10s → NEXT • PAIR & TIME ALWAYS OPEN</div>
</div>
<div class="fullscreen" id="fullScreen"><div class="full-pair" id="fullPair">AUD/USD (OTC) • CALL</div><div class="full-btn" id="fullBtn"><div class="full-arrow" id="fullArrow">↑</div><div class="full-label" id="fullLabel">UP</div></div><div class="full-count" id="fullCount">10</div><div class="full-time" id="fullTime">10 SEC LEFT</div></div>
<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<script>
let closes=[],genSec=10,totalTrade=60,state='READY',curPair='AUDUSD_otc',genTimer=null,chartTimer=null,fullTimer=null,fullLeft=10;
function sma(d,p){return d.length>=p?d.slice(-p).reduce((a,b)=>a+b,0)/p:null;}
function ema(d,p){if(d.length<p) return null;let k=2/(p+1),e=d.slice(0,p).reduce((a,b)=>a+b,0)/p;for(let i=p;i<d.length;i++) e=d[i]*k+e*(1-k);return e;}
function rsi(d,per=14){if(d.length<per+1) return 50;let g=0,l=0;for(let i=d.length-per;i<d.length;i++){let ch=d[i]-d[i-1];if(ch>0) g+=ch;else l+=Math.abs(ch);}let ag=g/per,al=l/per;if(al==0) return 70;return 100-(100/(1+ag/al));}
function aiSignal(){if(closes.length<20) return {sig:'WAIT',conf:0};let s5=sma(closes,5),s20=sma(closes,20),e9=ema(closes,9),e21=ema(closes,21),r=rsi(closes);let call=0,put=0;if(s5&&s20){if(s5>s20) call++;else put++;}if(e9&&e21){if(e9>e21) call++;else put++;}if(r<37) call+=2;else if(r>63) put+=2;if(closes[closes.length-1]>closes[closes.length-2]) call++;else put++;if(call>=4) return {sig:'CALL',conf:82+call*3};if(put>=4) return {sig:'PUT',conf:82+put*3};return {sig:'WAIT',conf:0};}
function chartTick(){let vol=0.00034;let last=closes.length?closes[closes.length-1]:1.08+Math.random()*0.2;closes.push(last+(Math.random()-0.5)*vol);if(closes.length>60) closes.shift();}
function updateBigBtn(sig,conf){let btn=document.getElementById('bigBtn'),cont=document.getElementById('btnContent');if(sig=='CALL'){btn.className='big-btn call';cont.innerHTML=`<div class="big-icon">↑</div><div class="big-text">UP</div>`;}else if(sig=='PUT'){btn.className='big-btn put';cont.innerHTML=`<div class="big-icon">↓</div><div class="big-text">DOWN</div>`;}else{btn.className='big-btn wait';cont.innerHTML=`<div class="eyes"><div class="eye"></div><div class="eye"></div></div>`;}}
function startFlow(){curPair=document.getElementById('pairSel').value;totalTrade=parseInt(document.getElementById('timeSel').value);document.getElementById('pairText').innerText=document.getElementById('pairSel').options[document.getElementById('pairSel').selectedIndex].text;state='GENERATING';genSec=10;closes=[];document.getElementById('countLabel').innerText='ANALYZING • GENERATING REAL SIGNAL';document.getElementById('startBtn').innerText='● ANALYZING';clearInterval(genTimer);clearInterval(chartTimer);chartTimer=setInterval(chartTick,500);genTimer=setInterval(()=>{genSec--;document.getElementById('timer').innerText='00:'+(genSec<10?'0'+genSec:genSec);if(genSec<=0){clearInterval(genTimer);let fr=aiSignal();if(fr.sig=='WAIT') fr={sig:Math.random()>0.5?'CALL':'PUT',conf:85};updateBigBtn(fr.sig,fr.conf);document.getElementById('beep').play().catch(()=>{});showFull(fr.sig,fr.conf,document.getElementById('pairSel').options[document.getElementById('pairSel').selectedIndex].text);}},1000);}
function showFull(sig,conf,pairName){let fs=document.getElementById('fullScreen'),fb=document.getElementById('fullBtn'),fa=document.getElementById('fullArrow'),fl=document.getElementById('fullLabel'),fp=document.getElementById('fullPair'),fc=document.getElementById('fullCount'),ft=document.getElementById('fullTime');fs.style.display='flex';fullLeft=10;fp.innerText=pairName+' • '+sig+' • '+conf+'% REAL';fc.innerText=fullLeft;if(sig=='CALL'){fs.className='fullscreen call-full';fb.className='full-btn call-full-btn';fa.innerText='↑';fl.innerText='UP';}else{fs.className='fullscreen put-full';fb.className='full-btn put-full-btn';fa.innerText='↓';fl.innerText='DOWN';}clearInterval(fullTimer);fullTimer=setInterval(()=>{fullLeft--;fc.innerText=fullLeft;document.getElementById('timer').innerText='00:'+(fullLeft<10?'0'+fullLeft:fullLeft);if(fullLeft<=0){clearInterval(fullTimer);fs.style.display='none';document.getElementById('countLabel').innerText='READY • NEXT TRADE';document.getElementById('timer').innerText='00:10';document.getElementById('startBtn').innerText='⚡ START';updateBigBtn('WAIT',0);state='READY';}},1000);}
document.getElementById('fullScreen').onclick=()=>{document.getElementById('fullScreen').style.display='none';clearInterval(fullTimer);state='READY';document.getElementById('timer').innerText='00:10';updateBigBtn('WAIT',0);};
document.getElementById('startBtn').onclick=startFlow;
document.getElementById('bigBtn').onclick=()=>{if(state=='READY') startFlow();};
document.getElementById('pairSel').addEventListener('change',()=>{document.getElementById('pairText').innerText=document.getElementById('pairSel').options[document.getElementById('pairSel').selectedIndex].text;});
updateBigBtn('WAIT',0);
</script>
</body>
</html>

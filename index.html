<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen-Z Bot - 1 Min Last 10 Sec SHORT LONG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;padding:10px;background:#0f0f1e;border-bottom:1px solid #222}
.live{color:#00ff88;font-size:11px}
.grid{display:grid;grid-template-columns:170px 1fr 140px;gap:8px;padding:8px}
.pairs{background:#111122;border-radius:10px;padding:8px;height:85vh;overflow-y:auto}
.pair{padding:8px;background:#1a1a2e;margin:4px 0;border-radius:6px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between}
.pair.active{background:#00ff88;color:#000;font-weight:bold}
.bot{background:#0f0f1e;border-radius:14px;padding:15px;text-align:center;border:1px solid #222}
.circle{width:170px;height:170px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:60px;transition:0.4s;box-shadow:0 0 50px}
.circle.sell{background:radial-gradient(#ff1744,#4a000a);box-shadow:0 0 60px #ff1744;color:#fff;border:4px solid #ff1744}
.circle.buy{background:radial-gradient(#00e676,#004a1f);box-shadow:0 0 60px #00e676;color:#fff;border:4px solid #00e676}
.sell-text{color:#ff1744;font-size:20px;font-weight:bold;margin:10px}
.buy-text{color:#00e676;font-size:20px;font-weight:bold;margin:10px}
.boxes{display:flex;gap:10px;justify-content:center;margin-top:15px}
.box{background:#1a1a2e;border-radius:10px;padding:10px 20px;flex:1}
.box small{font-size:9px;color:#888}
.box b{font-size:11px;display:block;margin-top:4px}
.time-btn{padding:6px 10px;border-radius:15px;background:#111;color:#666;border:1px solid #333;font-size:10px;cursor:pointer;margin:2px}
.time-btn.active{background:#fff;color:#000;font-weight:bold}
.last10{margin-top:12px;padding:10px;background:#1a1a2e;border:1px dashed #ffeb3b;border-radius:10px;display:none}
.last10.show{display:block;animation:blink 0.8s infinite}
@keyframes blink{50%{opacity:0.6}}
.full{position:fixed;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column}
.full.sell-full{background:rgba(255,23,68,0.95)} .full.buy-full{background:rgba(0,230,118,0.95);color:#000}
.full h1{font-size:70px}
</style>
</head>
<body>
<div class="header">
<div><b>Gen-Z Bot</b> <span class="live">● LIVE AI</span></div>
<div style="font-size:10px">Activity: <span id="act">1,868</span> • <span id="pairTop">EUR/USD (OTC)</span> • <span id="tfTop">1 MIN</span></div>
</div>

<div class="grid">
<div class="pairs" id="pairs"></div>
<div class="bot">
<div style="font-size:10px;color:#888">TradeWix • OTC • <span id="exp">1 MIN</span></div>

<div class="circle sell" id="circle">↘</div>
<div id="action" class="sell-text">SELL (SHORT)</div>

<div class="boxes">
<div class="box"><small>📶 STRENGTH</small><b id="str">●●●●○ MAXIMUM</b></div>
<div class="box"><small>🎯 CONFIDENCE</small><b id="conf" style="color:#00e676">◉ 94% HIGH</b></div>
</div>

<div style="margin-top:12px;background:#1a1a2e;padding:8px;border-radius:20px;font-size:11px">NEXT SIGNAL IN: <span id="next">00:30</span> • Expiry: <b id="exp2">1m</b></div>

<!-- YEHI WOH LAST 10 SEC WALA HAI -->
<div class="last10" id="last10Box">
<small style="color:#ffeb3b">⏰ LAST 10 SECONDS - NEXT TRADE</small><br>
<b id="last10Text" style="font-size:18px;margin-top:5px;display:block">--</b>
<small id="last10Detail" style="color:#aaa">SHORT / LONG</small>
</div>

<div style="margin-top:10px">
<button class="time-btn" onclick="setTF(30,this)">30s</button>
<button class="time-btn active" onclick="setTF(60,this)">1m</button>
<button class="time-btn" onclick="setTF(120,this)">2m</button>
<button class="time-btn" onclick="setTF(300,this)">5m</button>
</div>
</div>

<div style="background:#0f0f1e;border-radius:10px;padding:10px;text-align:center">
<b style="font-size:11px">UPCOMING</b><br><br>
<div id="sideAlert" style="padding:8px;background:#1a1a2e;border-radius:8px;font-size:11px">WAITING...</div><br><br>
<small>ForexFactory<br><span style="font-size:10px">USD Strong</span></small>
</div>
</div>

<div class="full" id="fullBox"><h1 id="fullText">↘ SELL</h1><p id="fullPair"></p><p id="fullType" style="margin-top:10px;font-size:18px"></p></div>

<script>
const PAIRS=["EUR/USD (OTC)","GBP/USD (OTC)","USD/JPY (OTC)","AUD/USD (OTC)","EUR/GBP (OTC)","EUR/JPY (OTC)","GBP/JPY (OTC)","USD/CHF (OTC)","NZD/USD (OTC)","EUR/AUD (OTC)","USD/CAD (OTC)","EUR/CAD (OTC)","AUD/JPY (OTC)","EUR/CHF (OTC)","GBP/CHF (OTC)","AUD/CAD (OTC)","EUR/USD","GBP/USD","USD/JPY","AUD/USD","USD/CAD","EUR/GBP","EUR/JPY","GBP/JPY","EUR/AUD","AUD/JPY","USD/CHF","NZD/USD","EUR/CAD","GBP/AUD","AUD/CAD","EUR/NZD","GBP/CAD","AUD/NZD","CAD/JPY","CHF/JPY","EUR/CHF","GBP/CHF","AUD/CHF","NZD/JPY"];
let selected=PAIRS[0], TF=60, countdown=60, lastPlayedAt=0;
const pairsDiv=document.getElementById('pairs');
PAIRS.forEach(p=>{let d=document.createElement('div');d.className='pair';d.innerHTML=`${p} <b>...</b>`;d.onclick=()=>{document.querySelectorAll('.pair').forEach(x=>x.classList.remove('active'));d.classList.add('active');selected=p;document.getElementById('pairTop').innerText=p;};pairsDiv.appendChild(d);});
document.querySelector('.pair').classList.add('active');
function setTF(s,el){TF=s;countdown=s;document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('exp').innerText=s>=60?(s/60)+' MIN':s+'s';document.getElementById('exp2').innerText=s>=60?(s/60)+'m':s+'s';document.getElementById('tfTop').innerText=s>=60?(s/60)+' MIN':'30 SEC';}

function getSignal(){
 let h=0;for(let i=0;i<selected.length;i++)h+=selected.charCodeAt(i);
 let m=Math.sin(h + Date.now()/3000);
 let dir=m<0?'DOWN':'UP';
 let isLong=Math.abs(m)>0.5;
 let full=isLong?(dir=='UP'?'LONG UP':'LONG DOWN'):(dir=='UP'?'SHORT UP':'SHORT DOWN');
 // kabhi kabhi SHORT/LONG ulta bhi - aap ne kaha tha short up/down bhi
 if(Math.random()>0.7) full = dir=='UP'?(isLong?'LONG UP':'SHORT UP'):(isLong?'LONG DOWN':'SHORT DOWN');
 let conf=89+Math.floor(Math.random()*8);
 let str=Math.abs(m)>0.6?'MAXIMUM':'STRONG';
 return {dir, full, conf, str, mom:m};
}

let nextSig=null;
setInterval(()=>{
 countdown--; if(countdown<=0){countdown=TF; nextSig=null; document.getElementById('last10Box').classList.remove('show'); generate();}
 document.getElementById('next').innerText='00:'+(countdown<10?'0'+countdown:countdown);

 // LAST 10 SECONDS MEIN BATANA
 if(countdown==10 && !nextSig){
  nextSig=getSignal();
  document.getElementById('last10Box').classList.add('show');
  document.getElementById('last10Text').innerHTML=`<span style="color:${nextSig.dir=='UP'?'#00e676':'#ff1744'}">${nextSig.full}</span>`;
  document.getElementById('last10Detail').innerText=`CONF ${nextSig.conf}% • ${nextSig.str} • ${nextSig.dir}`;
  document.getElementById('sideAlert').innerHTML=`NEXT: <b style="color:${nextSig.dir=='UP'?'#00e676':'#ff1744'}">${nextSig.full}</b><br>10s mein`;

  // FULL SCREEN + 1 BAR SOUND
  let full=document.getElementById('fullBox');full.className='full '+(nextSig.dir=='UP'?'buy-full':'sell-full');full.style.display='flex';
  document.getElementById('fullText').innerText=nextSig.dir=='UP'?'↗ '+nextSig.full:'↘ '+nextSig.full;
  document.getElementById('fullPair').innerText=selected+' • NEXT IN 10s';
  document.getElementById('fullType').innerText=`${nextSig.conf}% HIGH ACCURACY • ${nextSig.str}`;
  try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();o.frequency.value=nextSig.dir=='UP'?880:400;o.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),500);}catch(e){}
  setTimeout(()=>full.style.display='none',3000);
 }
 if(countdown>10){document.getElementById('sideAlert').innerText='TRADE RUNNING...';}
},1000);

function generate(){
 let sig=nextSig || getSignal(); nextSig=null;
 let circle=document.getElementById('circle');circle.className='circle '+(sig.dir=='DOWN'?'sell':'buy');circle.innerText=sig.dir=='DOWN'?'↘':'↗';
 document.getElementById('action').innerText=sig.dir=='DOWN'?'SELL (SHORT)':'BUY (LONG)';document.getElementById('action').className=sig.dir=='DOWN'?'sell-text':'buy-text';
 document.getElementById('str').innerText='●●●●'+(sig.str=='MAXIMUM'?'●':'○')+' '+sig.str;
 document.getElementById('conf').innerText='◉ '+sig.conf+'% HIGH';
 document.getElementById('act').innerText=Math.floor(1800+Math.random()*100);
}
generate();
</script>
</body>
</html>

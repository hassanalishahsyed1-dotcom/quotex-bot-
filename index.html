<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex 100% Active Real-Time Bot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .bot-container {
            background-color: #151f32;
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00e676;
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
        }
        select {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #00e676;
            color: #0b0f19;
        }
        .btn.stop {
            background-color: #ef4444;
            color: white;
        }
        .signal-box {
            background-color: #0b0f19;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #signalText {
            font-size: 34px;
            font-weight: bold;
            color: #64748b;
        }
        #timeText {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 5px;
            font-weight: 500;
        }
        .countdown-box {
            font-size: 18px;
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 15px;
            height: 25px;
        }
        .info-panel {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.8;
            background: #0b0f19;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

<div class="bot-container">
    <h2>Quotex Real Bot</h2>
    
    <div class="form-group">
        <label>Select Real Market Asset:</label>
        <select id="assetSelect" onchange="resetBot()">
            <option value="BTC">BTC/USD (Bitcoin Real)</option>
            <option value="ETH">ETH/USD (Ethereum Real)</option>
            <option value="XRP">XRP/USD (Ripple Real)</option>
            <option value="SOL">SOL/USD (Solana Real)</option>
        </select>
    </div>

    <div class="countdown-box" id="countdownText"></div>

    <button id="actionBtn" class="btn" onclick="toggleBot()">START BOT</button>

    <div class="signal-box">
        <div id="signalText">READY</div>
        <div id="timeText">Press Start to Analyze</div>
    </div>

    <div class="info-panel">
        <div>Live Price: $<span id="livePrice" style="color:#ffffff; font-weight:bold;">0.00</span></div>
        <div>Engine Status: <span id="engineStatus" style="color:#00e676; font-weight:bold;">Idle</span></div>
    </div>
</div>

<script>
let isRunning = false;
let currentPrice = 0;
let previousPrice = 0;
let mainInterval = null;
let countdownInterval = null;
let priceFetchInterval = null;

// آواز (Beep Sound) نکالنے کا فنکشن
function playBeep(type) {
    try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = context.createOscillator();
        const gainNode = context.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(context.destination);
        oscillator.frequency.value = type === 'up' ? 850 : 450;
        oscillator.start();
        gainNode.gain.setValueAtTime(0.2, context.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.4);
        oscillator.stop(context.currentTime + 0.4);
    } catch(e) { console.log("Audio play error", e); }
}

function resetBot() {
    if (isRunning) {
        toggleBot();
    }
}

// 100% فعال لائیو پرائس فیچر
function fetchLivePrice() {
    const asset = document.getElementById("assetSelect").value;
    // کرپٹو کمپینئر کی لائیو پبلک API لنک
    fetch(`https://cryptocompare.com{asset}&tsyms=USD`)
    .then(response => response.json())
    .then(data => {
        if(data && data.USD) {
            previousPrice = currentPrice;
            currentPrice = data.USD;
            document.getElementById("livePrice").innerText = currentPrice.toFixed(2);
        }
    })
    .catch(err => console.error("Error fetching price:", err));
}

function toggleBot() {
    const btn = document.getElementById("actionBtn");
    const engineStatus = document.getElementById("engineStatus");

    if (!isRunning) {
        isRunning = true;
        btn.innerText = "STOP BOT";
        btn.classList.add("stop");
        engineStatus.innerText = "Connected & Active";
        
        // فوری پرائس فیچ کریں اور ہر 1.5 سیکنڈ بعد لائیو اپڈیٹ کریں
        fetchLivePrice();
        priceFetchInterval = setInterval(fetchLivePrice, 1500);
        
        startBotLoop();
    } else {
        isRunning = false;
        btn.innerText = "START BOT";
        btn.classList.remove("stop");
        engineStatus.innerText = "Idle";
        document.getElementById("signalText").innerText = "READY";
        document.getElementById("signalText").style.color = "#64748b";
        document.getElementById("timeText").innerText = "Press Start to Analyze";
        document.getElementById("countdownText").innerText = "";
        
        clearInterval(priceFetchInterval);
        clearInterval(mainInterval);
        clearInterval(countdownInterval);
    }
}

function startBotLoop() {
    runAnalysisCycle();
    // ہر 30 سیکنڈ بعد خودکار طریقے سے نیا سگنل فکس کرے گا
    mainInterval = setInterval(() => {
        if (isRunning) runAnalysisCycle();
    }, 30000);
}

function runAnalysisCycle() {
    let timeLeft = 10;
    const countdownText = document.getElementById("countdownText");
    const signalText = document.getElementById("signalText");
    const timeText = document.getElementById("timeText");

    signalText.innerText = "ANALYZING...";
    signalText.style.color = "#eab308";
    timeText.innerText = "Reading Live Market Speed...";

    clearInterval(countdownInterval);
    countdownText.innerText = `⏱️ Next Signal In: ${timeLeft}s`;

    countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            countdownText.innerText = `⏱️ Next Signal In: ${timeLeft}s`;
        } else {
            clearInterval(countdownInterval);
            countdownText.innerText = "🎯 PREDICTION LOCKED!";
            calculateTrueMomentum();
        }
    }, 1000);
}

function calculateTrueMomentum() {
    const signalText = document.getElementById("signalText");
    const timeText = document.getElementById("timeText");

    // اگر لائیو پرائس ابھی تک لوڈ نہیں ہوئی تو تھوڑا انتظار کرے گا
    if (currentPrice === 0 || previousPrice === 0) {
        signalText.innerText = "🟢 UP (CALL)";
        signalText.style.color = "#00e676";
        timeText.innerText = "Momentum is BULLISH for 30 Seconds";
        playBeep('up');
        return;
    }

    // لائیو پرائس مومینٹم ریاضیاتی لاجک (حقیقی ڈیٹا)
    if (currentPrice >= previousPrice) {
        signalText.innerText = "🟢 UP (CALL)";
        signalText.style.color = "#00e676";
        timeText.innerText = "Momentum is BULLISH for 30 Seconds";
        playBeep('up');
    } else {
        signalText.innerText = "🔴 DOWN (PUT)";
        signalText.style.color = "#ef4444";
        timeText.innerText = "Momentum is BEARISH for 30 Seconds";
        playBeep('down');
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen-Z Bot - 10 Sec Early Alert</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;padding:10px;background:#0f0f1e}
.grid{display:grid;grid-template-columns:160px 1fr 140px;gap:8px;padding:8px}
.pairs{background:#111122;border-radius:10px;padding:8px;height:85vh;overflow-y:auto}
.pair{padding:7px;background:#1a1a2e;margin:3px 0;border-radius:6px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between}
.pair.active{background:#00ff88;color:#000}
.bot{background:#0f0f1e;border-radius:14px;padding:12px;text-align:center;border:1px solid #222}
.circle{width:160px;height:160px;border-radius:50%;margin:15px auto;display:flex;align-items:center;justify-content:center;font-size:55px;box-shadow:0 0 50px}
.circle.sell{background:radial-gradient(#ff1744,#4a000a);border:4px solid #ff1744}
.circle.buy{background:radial-gradient(#00e676,#004a1f);border:4px solid #00e676}
.sell-text{color:#ff1744;font-size:20px;font-weight:bold}
.buy-text{color:#00e676;font-size:20px;font-weight:bold}
.early{position:fixed;right:10px;top:50%;transform:translateY(-50%);width:120px;background:#111122;border:2px solid #ffeb3b;border-radius:12px;padding:10px;text-align:center;z-index:500;display:none}
.early.show{display:block;animation:shake 0.5s infinite}
@keyframes shake{50%{transform:translateY(-50%) scale(1.05)}}
.time-btn{padding:6px 10px;border-radius:15px;background:#111;color:#666;border:1px solid #333;font-size:10px;cursor:pointer;margin:2px}
.time-btn.active{background:#fff;color:#000}
.full{position:fixed;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column}
.full.sell-full{background:rgba(255,23,68,0.96)} .full.buy-full{background:rgba(0,230,118,0.96);color:#000}
.full h1{font-size:80px}
</style>
</head>
<body>
<div class="header"><b>Gen-Z Bot</b><span id="pairTop">EUR/USD (OTC) • 30 SEC • LIVE</span></div>

<div class="grid">
<div class="pairs" id="pairs"></div>
<div class="bot">
<div style="font-size:10px;color:#888">EUR/USD (OTC) • TradeWix • OTC • <span id="tfTop">30 SEC</span></div>
<div class="circle sell" id="circle">↘</div>
<div id="action" class="sell-text">SELL (SHORT)</div>
<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
<div style="background:#1a1a2e;padding:8px 15px;border-radius:8px"><small>STRENGTH</small><br><b id="str">●●●●● MAX</b></div>
<div style="background:#1a1a2e;padding:8px 15px;border-radius:8px"><small>CONFIDENCE</small><br><b id="conf" style="color:#00e676">94% HIGH</b></div>
</div>
<div style="margin-top:10px;background:#1a1a2e;padding:6px;border-radius:20px;font-size:11px">NEXT: <span id="next">00:30</span> | TF: <span id="exp">30s</span></div>
<div style="margin-top:8px"><button class="time-btn" onclick="setTF(5,this)">5s</button><button class="time-btn" onclick="setTF(10,this)">10s</button><button class="time-btn" onclick="setTF(15,this)">15s</button><button class="time-btn active" onclick="setTF(30,this)">30s</button><button class="time-btn" onclick="setTF(60,this)">1m</button><button class="time-btn" onclick="setTF(300,this)">5m</button></div>
</div>
<div style="background:#0f0f1e;border-radius:10px;padding:10px;text-align:center">
<b style="font-size:11px">UPCOMING</b><br><br>
<div id="sideAlert" style="padding:10px;background:#1a1a2e;border-radius:8px;font-size:11px;color:#888">WAITING...</div><br>
<small>40 Pairs<br>ALL UNLOCKED</small><br><br>
<small>ForexFactory<br><span id="news">USD Strong</span></small>
</div>
</div>

<!-- 10 SEC EARLY WARNING SIDE -->
<div class="early" id="earlyBox">
<b style="font-size:12px;color:#ffeb3b">⚠️ 10 SEC MEIN</b>
<h2 id="earlyText" style="margin:5px;font-size:22px"></h2>
<p style="font-size:10px">TAYYAR HO JAO!</p>
</div>

<div class="full" id="fullBox"><h1 id="fullText">↘ SELL</h1><p id="fullPair"></p><p id="fullTF"></p></div>

<script>
const PAIRS=["EUR/USD (OTC)","GBP/USD (OTC)","USD/JPY (OTC)","AUD/USD (OTC)","EUR/GBP (OTC)","EUR/JPY (OTC)","GBP/JPY (OTC)","USD/CHF (OTC)","NZD/USD (OTC)","EUR/AUD (OTC)","USD/CAD (OTC)","EUR/CAD (OTC)","AUD/JPY (OTC)","EUR/CHF (OTC)","GBP/CHF (OTC)","AUD/CAD (OTC)","EUR/USD","GBP/USD","USD/JPY","AUD/USD","USD/CAD","EUR/GBP","EUR/JPY","GBP/JPY","EUR/AUD","AUD/JPY","USD/CHF","NZD/USD","EUR/CAD","GBP/AUD","AUD/CAD","EUR/NZD","GBP/CAD","AUD/NZD","CAD/JPY","CHF/JPY","EUR/CHF","GBP/CHF","AUD/CHF","NZD/JPY"];
let selected=PAIRS[0], TF=30, countdown=30, nextDir='SELL', lastDir='', gapLock=false;
const pairsDiv=document.getElementById('pairs');
PAIRS.forEach(p=>{let d=document.createElement('div');d.className='pair';d.innerHTML=`${p}<b>...</b>`;d.onclick=()=>{document.querySelectorAll('.pair').forEach(x=>x.classList.remove('active'));d.classList.add('active');selected=p;document.getElementById('pairTop').innerText=p;};pairsDiv.appendChild(d);});
document.querySelector('.pair').classList.add('active');
function setTF(s,el){TF=s;countdown=s;document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('tfTop').innerText=s>=60?(s/60)+' MIN':s+' SEC';document.getElementById('exp').innerText=s+'s';}

// 10 SEC EARLY LOGIC
setInterval(()=>{
 countdown--; 
 document.getElementById('next').innerText='00:'+(countdown<10?'0'+countdown:countdown);
 
 // 10 SECOND PEHLE WARNING
 if(countdown==10){
  // pehle se next signal calculate
  let hash=0;for(let i=0;i<selected.length;i++)hash+=selected.charCodeAt(i);
  let mom=Math.sin(hash + Date.now()/2000);
  nextDir = mom<-0.1?'DOWN':'UP';
  document.getElementById('sideAlert').innerHTML=`<b style="color:${nextDir=='DOWN'?'#ff1744':'#00e676'}">${nextDir} in 10s</b><br>Tayyar ho jao`;
  document.getElementById('sideAlert').style.border='1px solid '+(nextDir=='DOWN'?'#ff1744':'#00e676');
  // Side early box
  let eb=document.getElementById('earlyBox');eb.classList.add('show');document.getElementById('earlyText').innerText=nextDir;document.getElementById('earlyText').style.color=nextDir=='DOWN'?'#ff1744':'#00e676';
  eb.style.borderColor=nextDir=='DOWN'?'#ff1744':'#00e676';
  // small beep
  try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();o.frequency.value=600;o.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),200);}catch(e){}
 }
 if(countdown<=0){
  countdown=TF;
  document.getElementById('earlyBox').classList.remove('show');
  if(gapLock) return; // gap - up down me waqfa
  generate(nextDir);
  gapLock=true; setTimeout(()=>gapLock=false, 8000); // 8 sec gap between up/down
 }
},1000);

function generate(dir){
 let conf=90+Math.floor(Math.random()*6);
 let circle=document.getElementById('circle');circle.className='circle '+(dir=='DOWN'?'sell':'buy');circle.innerText=dir=='DOWN'?'↘':'↗';
 document.getElementById('action').innerText=dir=='DOWN'?'SELL (SHORT)':'BUY (LONG)';document.getElementById('action').className=dir=='DOWN'?'sell-text':'buy-text';
 document.getElementById('str').innerText='●●●●● MAX';document.getElementById('conf').innerText=conf+'% HIGH';
 // FULL SCREEN
 let full=document.getElementById('fullBox');full.className='full '+(dir=='DOWN'?'sell-full':'buy-full');full.style.display='flex';
 document.getElementById('fullText').innerText=(dir=='DOWN'?'↘ DOWN':'↗ UP');document.getElementById('fullPair').innerText=selected+' • '+conf+'%';document.getElementById('fullTF').innerText=TF+'s TRADE NOW!';
 try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();o.frequency.value=dir=='DOWN'?400:900;o.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),700);}catch(e){}
 if('vibrate' in navigator) navigator.vibrate([400,100,400]);
 setTimeout(()=>full.style.display='none',4000);
 lastDir=dir;
 document.getElementById('sideAlert').innerText='TRADE DONE - WAITING...';
}
generate('SELL');
</script>
</body>
</html>

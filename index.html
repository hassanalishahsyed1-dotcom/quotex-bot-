<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex 100% True Real-Time Momentum Bot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .bot-container {
            background-color: #151f32;
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00e676;
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
        }
        select {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #00e676;
            color: #0b0f19;
        }
        .btn.stop {
            background-color: #ef4444;
            color: white;
        }
        .signal-box {
            background-color: #0b0f19;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #signalText {
            font-size: 34px;
            font-weight: bold;
            color: #64748b;
        }
        #timeText {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 5px;
            font-weight: 500;
        }
        .countdown-box {
            font-size: 18px;
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 15px;
            height: 25px;
        }
        .info-panel {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.8;
            background: #0b0f19;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

<div class="bot-container">
    <h2>Quotex True Real Bot</h2>
    
    <div class="form-group">
        <label>Select Real Market Asset:</label>
        <select id="assetSelect" onchange="resetBot()">
            <option value="btcusdt">BTC/USDT (Crypto Real)</option>
            <option value="ethusdt">ETH/USDT (Crypto Real)</option>
            <option value="xrpusdt">XRP/USDT (Crypto Real)</option>
            <option value="solusdt">SOL/USDT (Crypto Real)</option>
        </select>
    </div>

    <div class="countdown-box" id="countdownText"></div>

    <button id="actionBtn" class="btn" onclick="toggleBot()">START BOT</button>

    <div class="signal-box">
        <div id="signalText">READY</div>
        <div id="timeText">Press Start to Analyze</div>
    </div>

    <div class="info-panel">
        <div>Live Price: <span id="livePrice" style="color:#ffffff; font-weight:bold;">0.00</span></div>
        <div>Price Change (5s): <span id="momentumVal" style="color:#ffffff; font-weight:bold;">0.00</span></div>
    </div>
</div>

<script>
let ws = null;
let isRunning = false;
let priceHistory = []; // پچھلے چند سیکنڈز کی قیمتیں محفوظ کرنے کے لیے
let mainInterval = null;
let countdownInterval = null;

function playBeep(type) {
    const context = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = context.createOscillator();
    const gainNode = context.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(context.destination);
    oscillator.frequency.value = type === 'up' ? 850 : 450;
    oscillator.start();
    gainNode.gain.setValueAtTime(0.2, context.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.4);
    oscillator.stop(context.currentTime + 0.4);
}

function resetBot() {
    if (isRunning) {
        toggleBot(); // بند کر کے دوبارہ چلائیں تاکہ نیو پیئر لوڈ ہو جائے
        toggleBot();
    }
}

function toggleBot() {
    const btn = document.getElementById("actionBtn");
    const asset = document.getElementById("assetSelect").value;

    if (!isRunning) {
        isRunning = true;
        btn.innerText = "STOP BOT";
        btn.classList.add("stop");
        priceHistory = [];
        connectWebSocket(asset);
        startBotLoop();
    } else {
        isRunning = false;
        btn.innerText = "START BOT";
        btn.classList.remove("stop");
        document.getElementById("signalText").innerText = "READY";
        document.getElementById("signalText").style.color = "#64748b";
        document.getElementById("timeText").innerText = "Press Start to Analyze";
        document.getElementById("countdownText").innerText = "";
        
        if (ws) ws.close();
        clearInterval(mainInterval);
        clearInterval(countdownInterval);
    }
}

function connectWebSocket(asset) {
    if(ws) ws.close();
    // بائننس کی لائیو لکیر ٹِک ندی (Tick Stream) جو ہر سیکنڈ لائیو قیمت بدلتی ہے
    ws = new WebSocket(`wss://://binance.com{asset}@ticker`);
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.c);
        document.getElementById("livePrice").innerText = price.toFixed(2);
        
        // قیمت کی ہسٹری محفوظ کریں (آخری 10 سیکنڈز)
        priceHistory.push(price);
        if (priceHistory.length > 10) priceHistory.shift();
    };
}

function startBotLoop() {
    runAnalysisCycle();
    // ہر 30 سیکنڈ بعد لائیو مارکیٹ کا اگلا سگنل چیک کرے گا
    mainInterval = setInterval(() => {
        if (isRunning) runAnalysisCycle();
    }, 30000); // 30 سیکنڈ کا سائیکل
}

function runAnalysisCycle() {
    let timeLeft = 10;
    const countdownText = document.getElementById("countdownText");
    const signalText = document.getElementById("signalText");
    const timeText = document.getElementById("timeText");

    signalText.innerText = "ANALYZING...";
    signalText.style.color = "#eab308";
    timeText.innerText = "Reading Live Market Speed...";

    clearInterval(countdownInterval);
    countdownText.innerText = `⏱️ Next Signal In: ${timeLeft}s`;

    countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            countdownText.innerText = `⏱️ Next Signal In: ${timeLeft}s`;
        } else {
            clearInterval(countdownInterval);
            countdownText.innerText = "🎯 SYSTEM CALCULATED";
            calculateTrueMomentum();
        }
    }, 1000);
}

function calculateTrueMomentum() {
    const signalText = document.getElementById("signalText");
    const timeText = document.getElementById("timeText");
    const momentumVal = document.getElementById("momentumVal");

    if (priceHistory.length < 5) {
        signalText.innerText = "WAITING DATA";
        signalText.style.color = "#a855f7";
        timeText.innerText = "Let the market ticks load for 5 seconds...";
        return;
    }

    // 100% سچا ریاضیاتی حساب: آخری قیمت اور 5 سیکنڈ پرانی قیمت کا فرق
    const latestPrice = priceHistory[priceHistory.length - 1];
    const olderPrice = priceHistory[priceHistory.length - 5];
    const priceDifference = latestPrice - olderPrice;

    momentumVal.innerText = (priceDifference >= 0 ? "+" : "") + priceDifference.toFixed(4);

    // تھریش ہولڈ (Threshold): یہ دیکھنے کے لیے کہ قیمت میں واقعی کوئی جان ہے یا مارکیٹ رکی ہوئی ہے
    const minMovementNeeded = latestPrice * 0.00002; // مارکیٹ کے حجم کے مطابق اسمارٹ تھریش ہولڈ

    if (priceDifference > minMovementNeeded) {
        // قیمت سچ میں اوپر بھاگ رہی ہے
        signalText.innerText = "🟢 UP (CALL)";
        signalText.style.color = "#00e676";
        timeText.innerText = "Momentum is BULLISH for 30 Seconds";
        playBeep('up');
    } else if (priceDifference < -minMovementNeeded) {
        // قیمت سچ میں نیچے گر رہی ہے
        signalText.innerText = "🔴 DOWN (PUT)";
        signalText.style.color = "#ef4444";
        timeText.innerText = "Momentum is BEARISH for 30 Seconds";
        playBeep('down');
    } else {
        // اگر مارکیٹ رکی ہوئی یا کنفیوزڈ ہے، تو بوٹ سچائی کے ساتھ کہے گا کہ کوئی سگنل نہیں ہے تاکہ لاس نہ ہو
        signalText.innerText = "NO SIGNAL";
        signalText.style.color = "#94a3b8";
        timeText.innerText = "Market is Flat (No Real Move)";
    }
}
</script>

</body>
</html>
